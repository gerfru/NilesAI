name: SBOM

on:
  push:
    # release-please tags are prefixed with the package name (e.g. niles-core-v0.2.1);
    # "*-v*" matches those, "v*" keeps legacy/manual tags (v0.1.0, v0.2.2) working.
    tags: ["*-v*", "v*"]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638  # v0.24.1

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json=sbom.cdx.json

      - name: Upload SBOM as release asset
        run: gh release upload "$TAG_NAME" sbom.cdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
